# Server Port Configuration
server.port=${PORT:8080}

# Spring Datasource Configuration
# Defaults to persistent file-based H2 database (./data/emsdb), or connects to Aiven Cloud MySQL via DB_URL
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/emsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA and Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Enable H2 Console for development (access at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging configuration
logging.level.com.ems=DEBUG
logging.level.org.springframework.web=INFO
